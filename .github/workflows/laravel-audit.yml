name: Laravel Audit
on:
  push:
    branches: ['feature/ai-commerce-core']
  pull_request:
    branches: ['main','feature/ai-commerce-core']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate --force
      - run: find app config database routes resources -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php artisan route:list --except-vendor
      - run: php artisan view:cache
